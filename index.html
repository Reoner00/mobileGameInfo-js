<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./home/home.css" />
    <link rel="stylesheet" href="./style/global.css" />

    <title>Lietuvos Takais</title>
  </head>

  <body>
    <main class="home">
      <img src="./img/main/Jantar.png" class="jantar-img" />

      <img src="./img/main/Ruta.png" class="flower-img" />

      <img src="./img/main/Gaidelis.png" class="gaidelis-img" />

      <img src="img/main/Litai.png" class="litai-img" />

      <img src="img/main/Šakotis.png" class="sakotis-img" />

      <img src="img/main/Katekizmas.png" class="katekizmas-img" />

      <img src="img/main/Miglė.png" class="migle-img" />

      <img src="img/main/Gedimino_Bokštas_.png" class="tower-img" />

      <img src="img/main/12_Darius_Ir_Girėnas_.png" class="guys-img" />

      <img src="img/main/Troleibusas.png" class="train-img" />

      <img src="img/main/Kake_Make.png" class="kake-img" />

      <img src="img/main/TV_Bokstas.png" class="TV-img" />

      <img src="img/main/Gandras.png" class="gandras-img" />

      <img src="img/main/Fortūna_Karūna_.png" class="karuna-img" />

      <!-- CONTENT -->

      <div class="content">
        <h2>
          LIETUVOS <br />
          TAKAIS
        </h2>

        <p>
          Čia išsamiau galėsite susipažinti su objektais, personažais bei
          vietovėmis, kurie pavaizduoti žaidymo žemėlapyje :)
        </p>

        <div class="buttons">
          <button class="category-btn" data-cat="1">
            1 - 10 paveikslėliai
          </button>

          <button class="category-btn" data-cat="2">
            11 - 20 paveikslėliai
          </button>

          <button class="category-btn" data-cat="3">
            21 - 30 paveikslėliai
          </button>

          <button class="category-btn" data-cat="4">
            31 - 40 paveikslėliai
          </button>

          <button class="category-btn" data-cat="5">
            41 - 50 paveikslėliai
          </button>

          <button class="category-btn" data-cat="6">
            51 - 60 paveikslėliai
          </button>

          <button class="category-btn" data-cat="7">
            61 - 70 paveikslėliai
          </button>
          <button class="category-btn" data-cat="8">
            71 - 79 paveikslėliai
          </button>
        </div>
      </div>
    </main>
    <script>
      function openCategory(id) {
        window.location.href = `category/category.html?cat=${id}`;
      }

      document.querySelectorAll(".category-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const categoryId = button.dataset.cat;
          openCategory(categoryId);
        });
      });
    </script>
  </body>
</html>
