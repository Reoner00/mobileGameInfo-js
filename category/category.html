<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category</title>
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./category.css" />
  </head>

  <body class="category-loading">
    <main class="category-page">
      <div class="category-inner">
        <header class="category-header">
          <button class="back-up" type="button">
            <img class="removebag" src="../img/removebag.png" alt="" />
          </button>

          <div class="category-title">
            <h1>
              LIETUVOS <br />
              TAKAIS
            </h1>
          </div>
        </header>

        <section class="category-list" id="categoryList"></section>

        <button class="back-down" type="button">
          <img class="removebag" src="../img/removebag.png" alt="" />
        </button>

        <div class="empty-state" id="emptyState">
          Nėra objektų šiai kategorijai.
        </div>
      </div>
    </main>

    <script type="module" src="./category.js"></script>
  </body>
</html>
