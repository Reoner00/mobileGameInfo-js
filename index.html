    <meta

    />
    <link rel="stylesheet" href="./home/home.css" />
    <link rel="stylesheet" href="./style/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Lietuvos Takais</title>
  </head>

  <body>
    <main class="home">
      <img

      <img
        src="img/main/Šakotis.webp"

        decoding="async"

      />

      <img
        src="img/main/Katekizmas.webp"
        class="katekizmas-img"
        loading="lazy"
        decoding="async"
        alt=""
      />

      <img
        src="img/main/Miglė.webp"
        class="migle-img"

      <img

      <img
        src="img/main/Kake_Make.webp"
        class="kake-img"
        loading="lazy"

        alt=""
      />

      <img
        src="img/main/TV_Bokstas.webp"
        class="TV-img"
        loading="lazy"
        decoding="async"
        alt=""
      />

      <img

        class="gandras-img"

      <!-- CONTENT -->

      <div class="content">
        <h2>
          LIETUVOS <br />
          TAKAIS
        </h2>

        <p>
          Čia išsamiau galėsite susipažinti su objektais, personažais bei
          vietovėmis, kurie pavaizduoti žaidymo žemėlapyje :)
        </p>

        <div class="buttons">
          <button class="category-btn" data-cat="1">
            1 - 10 paveikslėliai
          </button>

          <button class="category-btn" data-cat="2">
            11 - 20 paveikslėliai
          </button>

          <button class="category-btn" data-cat="3">
            21 - 30 paveikslėliai
          </button>

          <button class="category-btn" data-cat="4">
            31 - 40 paveikslėliai
          </button>

          <button class="category-btn" data-cat="5">
            41 - 50 paveikslėliai
          </button>

          <button class="category-btn" data-cat="6">
            51 - 60 paveikslėliai
          </button>

          <button class="category-btn" data-cat="7">
            61 - 70 paveikslėliai
          </button>
          <button class="category-btn" data-cat="8">
            71 - 79 paveikslėliai
          </button>
        </div>
      </div>
    </main>
    <script>
      function openCategory(id) {
        window.location.href = `category/category.html?cat=${id}`;
      }

      document.querySelectorAll(".category-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const categoryId = button.dataset.cat;
          openCategory(categoryId);
        });
      });
    </script>
  </body>
</html>
